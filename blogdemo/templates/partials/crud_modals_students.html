<!-- ══════════════════════════════════
     MODAL DE CONFIRMACIÓN DE ELIMINACIÓN
══════════════════════════════════ -->
<div x-data="deleteModal()"
     @open-delete-modal.window="open($event.detail)"
     x-show="isOpen"
     x-transition:enter="ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
     style="display:none">

    <div @click.outside="isOpen = false"
         x-transition:enter="ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         class="bg-white rounded-xl shadow-2xl border border-gray-200 w-full max-w-sm mx-4 p-6">

        <!-- Ícono de advertencia -->
        <div class="flex items-center justify-center w-12 h-12 rounded-full bg-red-100 mx-auto mb-4">
            <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
        </div>

        <h3 class="text-base font-semibold text-gray-900 text-center mb-1">¿Eliminar estudiante?</h3>
        <p class="text-sm text-gray-500 text-center mb-6">
            Esta acción no se puede deshacer. Se eliminará permanentemente a
            <span class="font-semibold text-gray-800" x-text="studentName"></span>.
        </p>

        <div class="flex gap-3">
            <button @click="isOpen = false"
                    class="flex-1 px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100
                           hover:bg-gray-200 rounded-lg transition-all">
                Cancelar
            </button>

            <!-- Form que hace POST al delete de Django -->
            <form :action="deleteUrl" method="post" class="flex-1">
                {% csrf_token %}
                <button type="submit"
                        class="w-full px-4 py-2 text-sm font-medium text-white bg-red-600
                               hover:bg-red-700 rounded-lg transition-all">
                    Sí, eliminar
                </button>
            </form>
        </div>

    </div>
</div>

<!-- ══════════════════════════════════
     MODAL DE DETALLES DEL ESTUDIANTE
══════════════════════════════════ -->
<div x-data="detailModal()"
     @open-detail-modal.window="open($event.detail)"
     x-show="isOpen"
     x-transition:enter="ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
     style="display:none">

    <div @click.outside="isOpen = false"
         x-transition:enter="ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         class="bg-white rounded-xl shadow-2xl border border-gray-200 w-full max-w-md mx-4">

        <!-- Header del modal -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
            <div class="flex items-center gap-3">
                <!-- Avatar con iniciales -->
                <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center
                            text-sm font-bold text-indigo-600 flex-shrink-0"
                     x-text="initials"></div>
                <div>
                    <p class="font-semibold text-gray-900 text-sm" x-text="student.name"></p>
                    <p class="text-xs text-gray-400 font-mono" x-text="student.code"></p>
                </div>
            </div>
            <button @click="isOpen = false"
                    class="text-gray-400 hover:text-gray-600 transition p-1 rounded-lg hover:bg-gray-100">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Cuerpo del modal -->
        <div class="px-6 py-4 space-y-4">

            <!-- Información de contacto -->
            <div>
                <p class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mb-2">Contacto</p>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-50 rounded-lg px-3 py-2.5">
                        <p class="text-[10px] text-gray-400 mb-0.5">Correo UDG</p>
                        <p class="text-xs font-medium text-gray-800 break-all" x-text="student.email"></p>
                    </div>
                    <div class="bg-gray-50 rounded-lg px-3 py-2.5">
                        <p class="text-[10px] text-gray-400 mb-0.5">Teléfono</p>
                        <p class="text-xs font-medium text-gray-800" x-text="student.phone"></p>
                    </div>
                </div>
            </div>

            <!-- Información académica -->
            <div>
                <p class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mb-2">Académico</p>
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-gray-50 rounded-lg px-3 py-2.5">
                        <p class="text-[10px] text-gray-400 mb-0.5">Semestre</p>
                        <p class="text-xs font-medium text-gray-800" x-text="student.semester + '°'"></p>
                    </div>
                    <div class="bg-gray-50 rounded-lg px-3 py-2.5">
                        <p class="text-[10px] text-gray-400 mb-0.5">Admisión</p>
                        <p class="text-xs font-medium text-gray-800" x-text="student.admission"></p>
                    </div>
                    <div class="bg-gray-50 rounded-lg px-3 py-2.5">
                        <p class="text-[10px] text-gray-400 mb-0.5">Situación</p>
                        <p class="text-xs font-medium text-gray-800" x-text="student.situation"></p>
                    </div>
                </div>
            </div>

            <!-- Secciones futuras -->
            <div>
                <p class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mb-2">Relaciones</p>
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-gray-50 rounded-lg px-3 py-2.5 border border-dashed border-gray-200 text-center">
                        <p class="text-[10px] text-gray-400">Tutor</p>
                        <p class="text-xs text-gray-300 mt-0.5 italic">próximamente</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg px-3 py-2.5 border border-dashed border-gray-200 text-center">
                        <p class="text-[10px] text-gray-400">Beca</p>
                        <p class="text-xs text-gray-300 mt-0.5 italic">próximamente</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg px-3 py-2.5 border border-dashed border-gray-200 text-center">
                        <p class="text-[10px] text-gray-400">Tesis</p>
                        <p class="text-xs text-gray-300 mt-0.5 italic">próximamente</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Footer del modal -->
        <div class="px-6 py-3.5 border-t border-gray-100 bg-gray-50 rounded-b-xl flex justify-end gap-2">
            <button @click="isOpen = false"
                    class="px-4 py-1.5 text-sm font-medium text-gray-600 bg-white border border-gray-200
                           hover:bg-gray-100 rounded-lg transition-all">
                Cerrar
            </button>
            <a :href="editUrl"
               class="px-4 py-1.5 text-sm font-medium text-white bg-indigo-600
                      hover:bg-indigo-700 rounded-lg transition-all">
                Editar
            </a>
        </div>

    </div>
</div>

<script>
function detailModal() {
    return {
        isOpen: false,
        student: {},
        initials: '',
        editUrl: '',
        open(detail) {
            this.student  = detail;
            this.editUrl  = `/students/${detail.id}/edit/`;
            const parts   = detail.name.trim().split(' ');
            this.initials = parts.length >= 2
                ? parts[0][0].toUpperCase() + parts[1][0].toUpperCase()
                : parts[0].slice(0, 2).toUpperCase();
            this.isOpen = true;
        }
    }
}

function deleteModal() {
    return {
        isOpen: false,
        studentName: '',
        deleteUrl: '',
        open(detail) {
            this.studentName = detail.name;
            // Ajusta la URL al patrón de tu urls.py
            this.deleteUrl = `/students/${detail.id}/delete/`;
            this.isOpen = true;
        }
    }
}
</script>
