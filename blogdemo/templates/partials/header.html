<!-- templates/partials/header.html -->
<header class="h-14 bg-white/80 backdrop-blur-md border-b border-gray-200
               flex items-center justify-between px-6 sticky top-0 z-40 flex-shrink-0">

    <!-- Izquierda: botón móvil + breadcrumb -->
    <div class="flex items-center gap-3">

        <!-- Hamburguesa (solo móvil) -->
        <button class="md:hidden text-gray-500 hover:text-gray-800 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <!-- Breadcrumb -->
        <p class="hidden md:block text-sm text-gray-400 font-medium">
            Panel /
            <span class="text-gray-700">{% block breadcrumb %}Dashboard{% endblock %}</span>
        </p>

    </div>

</header>
