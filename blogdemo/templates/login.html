{% extends 'base.html' %}

{% block body %}

<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl shadow-slate-900/5 border border-slate-200 p-8">

    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight mb-2">Bienvenido</h1>
      <p class="text-sm text-slate-500">Ingresa tus credenciales para acceder</p>
    </div>

    <!-- HTMX Error Container -->
    <div id="alert-container" class="mb-5">
      {% if form.errors %}
        <div class="bg-red-50 border border-red-200 text-red-800 text-sm font-medium rounded-xl p-3 text-center animate-fade-in">
          <p>Usuario o contraseña incorrectos.</p>
        </div>
      {% endif %}
    </div>

    <!-- Login Form -->
    <form hx-post="{% url 'login' %}"
          hx-target="#alert-container"
          hx-swap="innerHTML"
          hx-indicator="#loading-spinner">

      {% csrf_token %}

      <!-- Username Field -->
      <div class="mb-5">
        <label for="username" class="block text-sm font-semibold text-slate-800 mb-1.5">Usuario</label>
        <input type="text"
               id="username"
               name="username"
               required
               placeholder="tu_usuario"
               autocomplete="username"
               class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-900 text-sm focus:bg-white focus:border-indigo-600 focus:ring-4 focus:ring-indigo-600/15 outline-none transition duration-200">
      </div>

      <!-- Password Field -->
      <div class="mb-6">
        <label for="password" class="block text-sm font-semibold text-slate-800 mb-1.5">Contraseña</label>
        <div class="relative flex items-center">
          <input type="password"
                 id="password"
                 name="password"
                 required
                 placeholder="••••••••"
                 autocomplete="current-password"
                 class="w-full pl-4 pr-11 py-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-900 text-sm focus:bg-white focus:border-indigo-600 focus:ring-4 focus:ring-indigo-600/15 outline-none transition duration-200">

          <button type="button"
                  onclick="togglePasswordVisibility()"
                  title="Mostrar u ocultar contraseña"
                  class="absolute right-3 p-1 text-slate-400 hover:text-slate-700 transition duration-150 rounded-lg">
            <svg id="eye-icon" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit"
              class="w-full h-12 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold rounded-xl text-sm transition duration-150 flex items-center justify-center shadow-sm">
        <span class="[.htmx-request_&]:hidden">Iniciar Sesión</span>

        <!-- HTMX Spinner using Tailwind animate-spin -->
        <svg id="loading-spinner"
             class="htmx-indicator hidden [.htmx-request_&]:block w-5 h-5 text-white animate-spin"
             xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </button>
    </form>
  </div>
</div>

<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      `;
    } else {
      passwordInput.type = 'password';
      eyeIcon.innerHTML = `
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      `;
    }
  }
</script>

{% endblock %}
